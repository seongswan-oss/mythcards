// ============================================================ 대인전 (방 코드)
// 연결: PeerJS(WebRTC). 처음 만날 때만 공개 중개 서버(0.peerjs.com)를 쓰고, 그 뒤로는 두 기기가 직접 행동을 주고받는다.
// 메시지(JSON)
//   참가자 → 방장  {t:'hello', proto, hash, name, deck:[번호…], levels:{번호:레벨}}
//   방장 → 참가자  {t:'start', seed, first, term, name, deck, levels, fair}   또는 {t:'err', why}
//   서로           {t:'act', a:행동} {t:'chat', s:글} {t:'bye'}
// 두 기기는 같은 시드·같은 행동 순서로 같은 결과를 계산한다(v1.6 같은 네트워크 대전과 같은 원리).
const NET_PROTO = 'VMC3';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const PEER_PREFIX = 'voltaic-mythcards-';
// 연결 도우미 서버(STUN/TURN). PeerJS 기본값에 구글 STUN 을 더한다.
const PEER_OPTS = { config: { iceServers: [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] },
  { urls: 'turn:eu-0.turn.peerjs.com:3478', username: 'peerjs', credential: 'peerjsp' },
  { urls: 'turn:us-0.turn.peerjs.com:3478', username: 'peerjs', credential: 'peerjsp' }] } };
const PHRASES = ['안녕하세요', '잘 부탁해요', '잘했어요!', '고민 중…', '아이고', '한 판 더?', '좋은 대전이었어요'];
let peerLib = null, lobby = null;

function cardsHash() {
  const src = ((HOSTDATA && HOSTDATA.cards) || DATA.cards) + '\n#tags\n' + ((HOSTDATA && HOSTDATA.tags) || DATA.tags);
  const text = src.replace(/\r/g, '');
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16);
}
function netAvailable() {
  if (/(^|\.)claude\.ai$|claudeusercontent|claude\.site/.test(location.hostname)) return '이 링크(claude.ai) 안에서는 대인전 연결이 막혀 있습니다. 내 웹 주소나 PC판(exe)에서 열어 주세요.';
  if (typeof RTCPeerConnection === 'undefined') return '이 브라우저는 대인전 연결(WebRTC)을 지원하지 않습니다.';
  return '';
}
function loadPeer() {
  if (window.Peer) return Promise.resolve(window.Peer);
  if (peerLib) return peerLib;
  peerLib = new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
    sc.onload = () => window.Peer ? ok(window.Peer) : fail(new Error('연결 도구를 읽지 못했습니다'));
    sc.onerror = () => { peerLib = null; fail(new Error('인터넷에 연결되어 있는지 확인하세요 (연결 도구를 받지 못함)')); };
    document.head.appendChild(sc);
  });
  return peerLib;
}
// 시험용: 주소에 ?bc=1 이 있으면 같은 브라우저의 두 탭끼리 BroadcastChannel 로 연결한다.
function useLoopback() { return /[?&]bc=1/.test(location.search) && typeof BroadcastChannel !== 'undefined'; }
function loopbackConn(code, me) {
  const ch = new BroadcastChannel('vmc-' + code), handlers = {};
  ch.onmessage = e => { if (e.data.from !== me && handlers.data) handlers.data(e.data.m); };
  return { send: m => ch.postMessage({ from: me, m }), on: (ev, fn) => { handlers[ev] = fn; }, close: () => ch.close(), open: true };
}

function makeCode() { let s = ''; for (let i = 0; i < 6; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
function deckValid(ids) {
  if (!Array.isArray(ids) || ids.length !== MC.DeckSize) return false;
  const n = new Map();
  for (const id of ids) { if (!S.byId.has(id)) return false; n.set(id, (n.get(id) || 0) + 1); if (n.get(id) > MC.MaxCopies) return false; }
  return true;
}
function myLevels(ids) { const o = {}; for (const id of new Set(ids)) o[id] = levelOfCard(S.byId.get(id)); return o; }

function netSend(m) {
  const n = S.net; if (!n || n.ended || !n.conn) return;
  try { n.conn.send(m); } catch (e) { netLost('연결이 끊겼습니다.'); }
}
function netClose() {
  if (lobby) { lobby.cleanup(); lobby = null; }
  const n = S.net; if (!n) return;
  try { if (!n.ended && n.conn) n.conn.send({ t: 'bye' }); } catch (e) { /* 무시 */ }
  setTimeout(() => { try { n.conn && n.conn.close(); } catch (e) { } try { n.peer && n.peer.destroy(); } catch (e) { } }, 300);
  S.net = null;
  const cb = document.getElementById('chatBtn'); if (cb) cb.classList.add('hidden');
}
function netLost(why) {
  const n = S.net; if (!n || n.ended) return;
  n.ended = true;
  if (S.game) { S.game.log.push('※ ' + why); render(); }
  if (S.game && S.game.winner < 0) sheet(`<h2>${esc(why)}<\/h2><div class="muted">이 대전은 경험치 없이 끝납니다.<\/div><div class="btns"><button data-a="home">처음 화면<\/button><button class="primary" data-a="lobby">대인전 다시<\/button><\/div>`,
    (a, b, close) => { close(); if (a === 'home') showHome(); else { netClose(); netLobby(); } });
}
function onNetData(m) {
  const n = S.net; if (!n || !m || typeof m !== 'object') return;
  if (m.t === 'act' && S.game) {
    if (!applyAndShow(1 - S.mySide, m.a)) { toast('상대 행동을 적용하지 못했습니다(두 기기 상태가 어긋남)'); S.game.log.push('※ 동기화 오류'); }
  } else if (m.t === 'chat') {
    const s = String(m.s || '').slice(0, 60);
    if (S.game) { S.game.log.push(S.game.players[1 - S.mySide].title + ': ' + s); render(); }
    bubble(s);
  } else if (m.t === 'bye') netLost('상대가 대전을 나갔습니다.');
}
function bubble(s) {
  const fh = document.getElementById('foeHero'); if (!fh) { toast(s); return; }
  const r = fh.getBoundingClientRect(), b = document.createElement('div');
  b.className = 'toast'; b.style.top = (r.bottom + 6) + 'px'; b.style.background = '#fff'; b.style.color = '#222'; b.textContent = '💬 ' + s;
  document.body.appendChild(b); setTimeout(() => b.remove(), 3200);
}
function chatSheet() {
  if (!S.net || S.net.ended) return;
  const s = sheet(`<h2>말하기<\/h2><div class="btns" style="flex-wrap:wrap">${PHRASES.map((p, i) => `<button data-a="p${i}" style="flex:0 0 auto">${esc(p)}<\/button>`).join('')}<\/div>
    <div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="chatIn" maxlength="60" placeholder="직접 쓰기"><button class="primary" data-a="send" style="flex:none">보내기<\/button><\/div>`,
    (a, b, close) => {
      let text = '';
      if (a.startsWith('p')) text = PHRASES[+a.substring(1)];
      else if (a === 'send') text = s.el.querySelector('#chatIn').value.trim();
      if (!text) return;
      close(); netSend({ t: 'chat', s: text });
      if (S.game) { S.game.log.push(S.game.players[S.mySide].title + ': ' + text); render(); }
    });
  s.el.querySelector('#chatIn').addEventListener('keydown', e => { if (e.key === 'Enter') s.el.querySelector('[data-a=send]').click(); });
}

// ------------------------------------------------------------ 대기실
function netLobby() {
  const why = netAvailable();
  if (why && !useLoopback()) {
    sheet(`<h2>대인전<\/h2><p>${esc(why)}<\/p><div class="btns"><button data-a="close">닫기<\/button><\/div>`, (a, b, close) => close());
    return;
  }
  const opts = deckList().map(x => `<option value="${x.key}">${x.key[0] === 'p' ? '[추천] ' : ''}${esc(x.d.title)}<\/option>`).join('');
  const L = S.last;
  const s = sheet(`<h2>대인전<\/h2>
    <div class="grid2"><div><h3>내 이름<\/h3><input type="text" id="nName" maxlength="12" value="${esc(L.name || '')}" placeholder="이름"><\/div>
    <div><h3>내 덱<\/h3><select id="nDeck">${opts}<\/select><\/div><\/div>
    <h3>방 만들기<\/h3>
    <div style="display:flex;gap:8px"><select id="nFair"><option value="-1">랭크 적용 (경험치 쌓임)<\/option><option value="0">공정 · 정령<\/option><option value="6">공정 · 반신<\/option><option value="12">공정 · 상급신<\/option><option value="23">공정 · 태초신<\/option><\/select>
    <button class="primary" data-a="host" style="flex:none">방 만들기<\/button><\/div>
    <h3>참가하기<\/h3>
    <div style="display:flex;gap:8px"><input type="text" id="nCode" maxlength="6" placeholder="방 코드 6자리" style="text-transform:uppercase;letter-spacing:4px;text-align:center"><button class="primary" data-a="join" style="flex:none">참가<\/button><\/div>
    <div id="nStatus" class="muted" style="margin-top:12px;min-height:1.5em"><\/div>
    <div id="nCodeBox" class="hidden" style="font-size:34px;font-weight:700;letter-spacing:8px;text-align:center;background:#f6e3b0;border-radius:10px;padding:10px;margin-top:6px"><\/div>
    <div class="btns"><button data-a="cancel">닫기<\/button><\/div>`,
    (a, b, close) => {
      if (a === 'cancel') { if (lobby) { lobby.cleanup(); lobby = null; } close(); return; }
      if (lobby) return;
      const name = (s.el.querySelector('#nName').value.trim() || '이름 없음').slice(0, 12);
      const deckKey = s.el.querySelector('#nDeck').value;
      S.last.name = name; S.last.netDeck = deckKey; store.set('last', S.last);
      const deck = deckOf(deckKey);
      if (!deck || !deckValid(deck.ids)) { status('덱이 올바르지 않습니다(20장).'); return; }
      if (a === 'host') hostRoom(name, deck.ids.slice(), +s.el.querySelector('#nFair').value, close, status, s.el);
      else if (a === 'join') {
        const code = s.el.querySelector('#nCode').value.trim().toUpperCase();
        if (!/^[A-Z0-9]{6}$/.test(code)) { status('방 코드 6자리를 넣으세요.'); return; }
        joinRoom(code, name, deck.ids.slice(), close, status);
      }
    }, { modal: true });
  const status = t => { const el = s.el.querySelector('#nStatus'); if (el) el.textContent = t; };
  if (L.netDeck && [...s.el.querySelector('#nDeck').options].some(o => o.value === L.netDeck)) s.el.querySelector('#nDeck').value = L.netDeck;
  else if ([...s.el.querySelector('#nDeck').options].some(o => o.value === L.my)) s.el.querySelector('#nDeck').value = L.my;
}

function hostRoom(name, deckIds, fair, closeLobby, status, el) {
  const code = makeCode();
  const box = el.querySelector('#nCodeBox');
  box.textContent = code; box.classList.remove('hidden');
  status('이 코드를 상대에게 알려 주세요 · 연결 준비 중…');
  let peer = null, done = false;
  lobby = { cleanup: () => { if (!done) { try { peer && peer.destroy(); } catch (e) { } } } };
  const onHello = (conn, m) => {
    if (done) return;
    const refuse = why => { try { conn.send({ t: 'err', why }); } catch (e) { } };
    if (!m || m.t !== 'hello') return;
    if (m.proto !== NET_PROTO) return refuse('프로그램 버전이 다릅니다. 둘 다 새로 고쳐 주세요.');
    if (m.hash !== cardsHash()) return refuse('두 기기의 카드 목록이 다릅니다.');
    if (!deckValid(m.deck)) return refuse('상대 덱이 올바르지 않습니다.');
    done = true;
    const start = { t: 'start', seed: (Math.random() * 2 ** 31) >>> 0, first: Math.floor(Math.random() * 2), term: MC.termOfDate(new Date()),
      name, deck: deckIds, levels: myLevels(deckIds), fair };
    conn.send(start);
    lobby = null; closeLobby();
    beginNetGame(0, conn, peer, start, { name, deck: deckIds, levels: start.levels },
      { name: String(m.name || '상대').slice(0, 12), deck: m.deck, levels: m.levels || {} });
  };
  if (useLoopback()) {
    const conn = loopbackConn(code, 'host');
    conn.on('data', m => { if (!done) onHello(conn, m); else onNetData(m); });
    status('이 코드를 상대에게 알려 주세요 · 기다리는 중… (시험 연결)');
    lobby = { cleanup: () => { if (!done) conn.close(); } };
    return;
  }
  loadPeer().then(Peer => {
    status('중개 서버에 연결하는 중…');
    peer = new Peer(PEER_PREFIX + code, PEER_OPTS);
    const openTimer = setTimeout(() => { if (!done && !peer.open) status('중개 서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 닫았다가 다시 만들어 주세요.'); }, 15000);
    peer.on('open', () => { clearTimeout(openTimer); status('이 코드를 상대에게 알려 주세요 · 기다리는 중… (이 화면을 켜 둔 채로)'); });
    // 폰 화면이 꺼지거나 다른 앱으로 가면 중개 서버 연결이 끊긴다 → 다시 붙는다
    peer.on('disconnected', () => { if (!done) { status('중개 서버 연결이 끊겨 다시 연결하는 중…'); try { peer.reconnect(); } catch (e) { } } });
    peer.on('error', err => {
      if (done) { if (S.net && S.net.peer === peer) netLost('연결 오류: ' + (err.type || err.message)); return; }
      status(err.type === 'unavailable-id' ? '코드가 겹쳤습니다. 닫고 다시 만들어 주세요.' : '연결 준비 실패: ' + (err.type || err.message));
    });
    peer.on('connection', conn => {
      if (!done) status('상대가 들어오는 중…');
      if (done) { conn.on('open', () => { conn.send({ t: 'err', why: '이미 대전 중인 방입니다.' }); setTimeout(() => conn.close(), 500); }); return; }
      conn.on('data', m => { if (!done) onHello(conn, m); else if (S.net && S.net.conn === conn) onNetData(m); });
      conn.on('close', () => { if (S.net && S.net.conn === conn) netLost('상대와 연결이 끊겼습니다.'); });
    });
  }).catch(e => status(e.message));
}

function joinRoom(code, name, deckIds, closeLobby, status) {
  status('연결하는 중…');
  let peer = null, done = false;
  lobby = { cleanup: () => { if (!done) { try { peer && peer.destroy(); } catch (e) { } } } };
  const hello = { t: 'hello', proto: NET_PROTO, hash: cardsHash(), name, deck: deckIds, levels: myLevels(deckIds) };
  const onMsg = (conn, m) => {
    if (done) { if (S.net && S.net.conn === conn) onNetData(m); return; }
    if (m && m.t === 'err') { status('방장이 거절했습니다: ' + m.why); lobby && lobby.cleanup(); lobby = null; return; }
    if (m && m.t === 'start') {
      if (!deckValid(m.deck)) { status('방장의 덱을 읽을 수 없습니다.'); return; }
      done = true; lobby = null; closeLobby();
      beginNetGame(1, conn, peer, m, { name: String(m.name || '방장').slice(0, 12), deck: m.deck, levels: m.levels || {} },
        { name, deck: deckIds, levels: hello.levels });
    }
  };
  if (useLoopback()) {
    const conn = loopbackConn(code, 'guest');
    conn.on('data', m => onMsg(conn, m));
    lobby = { cleanup: () => { if (!done) conn.close(); } };
    conn.send(hello);
    return;
  }
  loadPeer().then(Peer => {
    status('중개 서버에 연결하는 중…');
    peer = new Peer(PEER_OPTS);
    let stage = 0; // 0 중개 서버, 1 방 찾는 중(직접 연결 협상), 2 연결됨
    const fail = msg => { if (done) return; clearTimeout(timer); status(msg); if (lobby) { lobby.cleanup(); lobby = null; } };
    const timer = setTimeout(() => {
      if (stage === 0) fail('중개 서버에 연결하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 [참가]를 누르세요.');
      else if (stage === 1) fail('방에 직접 연결하지 못했습니다. 방장 화면이 켜져 있는지 확인하고 다시 [참가]를 누르세요. 계속 안 되면 두 기기를 같은 와이파이에 두고 해 보세요.');
      else fail('방장이 응답하지 않습니다. 다시 [참가]를 누르세요.');
    }, 25000);
    peer.on('open', () => {
      stage = 1; status('방을 찾는 중…');
      const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      conn.on('open', () => { stage = 2; status('방을 찾았습니다 · 시작 준비 중…'); conn.send(hello); });
      conn.on('error', err => fail('연결 실패: ' + (err && (err.type || err.message) || '')));
      conn.on('data', m => onMsg(conn, m));
      conn.on('close', () => { if (S.net && S.net.conn === conn) netLost('상대와 연결이 끊겼습니다.'); });
    });
    peer.on('error', err => {
      clearTimeout(timer);
      if (done) { if (S.net && S.net.peer === peer) netLost('연결 오류: ' + (err.type || err.message)); return; }
      fail(err.type === 'peer-unavailable' ? '그 코드의 방이 없습니다. 코드와, 방장 화면이 켜져 있는지 확인하세요.' : '연결 실패: ' + (err.type || err.message));
    });
  }).catch(e => status(e.message));
}

// 두 기기 모두: 방장 = 0번, 참가자 = 1번
function beginNetGame(mySide, conn, peer, start, hostInfo, guestInfo) {
  stopAi();
  const deck0 = hostInfo.deck.map(id => S.byId.get(id)), deck1 = guestInfo.deck.map(id => S.byId.get(id));
  const g = new MC.Game(deck0, deck1, hostInfo.name, guestInfo.name, start.seed);
  g.startTerm = start.term % 24;
  const levels = [hostInfo.levels || {}, guestInfo.levels || {}];
  g.tierOf = (sd, c) => {
    const lv = start.fair >= 0 ? start.fair : (levels[sd][c.id] || 0);
    return [MC.tierOfLevel(lv), MC.starOfLevel(lv)];
  };
  S.net = { conn, peer, fair: start.fair, ended: false };
  S.game = g; S.ai = null; S.mySide = mySide; S.practice = false;
  S.placing = null; S.pending = null; S.selUid = 0; S.resultShown = false;
  buildBattle();
  g.start(start.first);
  g.log.push('대인전: ' + hostInfo.name + ' 대 ' + guestInfo.name + ' · ' + (start.fair >= 0 ? '공정 모드 ' + MC.rankTextOfLevel(start.fair) : '랭크 적용'));
  render();
  toast('연결되었습니다 · ' + (g.current === mySide ? '내가 먼저' : '상대가 먼저'));
}

// exe 메뉴에서 부르는 명령
window.VMC = {
  cmd(name) {
    document.querySelectorAll('.sheetBack').forEach(x => x.remove());
    if (name === 'home') { if (S.game && S.game.winner < 0) ask('대전을 그만둘까요? (경험치 없음)', '그만두기', showHome); else showHome(); return; }
    if (name === 'new') { if (S.game && S.game.winner < 0) ask('지금 대전을 그만두고 새로 시작할까요?', '새 대전', () => { stopAi(); newGameSheet(); }); else newGameSheet(); return; }
    if (name === 'net') { if (S.game && S.game.winner < 0) ask('지금 대전을 그만두고 대인전을 열까요?', '대인전', () => { stopAi(); netClose(); netLobby(); }); else netLobby(); return; }
    const f = { decks: deckEditor, coll: collection, rules: rulesSheet, log: logSheet }[name]; if (f) f();
  },
  // 신화 연표에서 얻은 경험치 등 exe 쪽 값과 합친다(큰 값을 남김)
  mergeXp(obj) {
    for (const k in obj) if ((obj[k] || 0) > (S.xp[k] || 0)) S.xp[k] = obj[k];
    if (S.game) render();
  },
  isHosted: () => !!HOST
};
window.addEventListener('DOMContentLoaded', init);
})();
