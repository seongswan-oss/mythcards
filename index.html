<title>Voltaic Myth Card Battle (신화 카드 대전) with Claude</title>
<style>:root{--bg:#262a33;--panel:#2f343f;--line:#4a5262;--text:#e8ebf0;--muted:#9aa3b2;--gold:#e6c878;--accent:#5aa0ff;--danger:#ff7a7a;--ok:#7fdc8a;
--cw:min(calc((100vw - 28px)/7 - 4px),84px);--ch:calc(var(--cw)*1.32);--hw:min(84px,23vw);--hh:calc(var(--hw)*1.38);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overscroll-behavior:none}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:var(--text);background:#3a4150;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:active{transform:scale(.97)}button.primary{background:#d9a93c;color:#241a05;border-color:#d9a93c;font-weight:600}
button:disabled{opacity:.45}
select,input[type=text]{font:inherit;color:var(--text);background:#20242c;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* ---------- 맨 위 */
#topbar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#1e2229;font-size:12.5px;min-height:34px}
#topbar .term{display:flex;align-items:center;gap:6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
#topbar .term .nm{color:var(--gold);font-weight:600}
#topbar .term .rest{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
#topbar .track{display:flex;gap:2px}
@media (max-width:700px){#topbar .track{display:none}}
#topbar .track i{width:6px;height:10px;border-radius:2px;display:block}
#menuBtn{padding:4px 10px}
.elb{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;border:1.5px solid #fff;flex:none}
/* ---------- 판 */
#main{flex:1;display:flex;min-height:0}
#board{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-width:0;min-height:0;padding:4px 6px 0;position:relative}
.hero{display:flex;align-items:center;gap:10px;margin:2px auto;padding:6px 12px;border-radius:10px;border:1.5px solid #8c96a8;min-width:min(330px,94%);justify-content:space-between;font-size:13px}
.hero.me{background:#34506e}.hero.foe{background:#6b3a3a}
.hero.turn{border-color:var(--gold);box-shadow:0 0 0 2px rgba(230,200,120,.35)}
.hero.tgt{border-color:#ff6a3d;box-shadow:0 0 0 3px rgba(255,106,61,.55)}
.hero .nm{font-weight:600}.hero .hp{font-size:22px;font-weight:700}.hero .hp.low{color:#ffb0b0}
.hero .sub{color:#cfd6e2;font-size:11.5px}
.mana{display:flex;gap:2px;align-items:center}.mana i{width:9px;height:11px;border-radius:50%;background:#3a4252;display:block}.mana i.on{background:#4aa0ff}.mana i.max{background:#2a4a70}
.row{display:flex;justify-content:center;align-items:center;gap:4px;min-height:calc(var(--ch) + 8px);padding:4px 0}
.row .empty{color:#6e7888;font-size:12px}
.mid{height:22px;display:flex;align-items:center;justify-content:center;position:relative}
.mid::before{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:1.5px dashed #556070}
.mid span{position:relative;background:var(--bg);padding:0 10px;font-size:12.5px;color:var(--gold);font-weight:600;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- 카드 */
.card{position:relative;width:var(--cw);height:var(--ch);border-radius:8px;background:#efe9dc;color:#1c1c20;border:1.5px solid #3c3c46;flex:none;display:flex;flex-direction:column;overflow:visible;cursor:pointer;transition:transform .12s}
.card .band{margin:3px 3px 0;border-radius:5px;color:#fff;text-align:center;padding:2px calc(var(--cw)*0.28) 1px;font-weight:700;font-size:calc(var(--cw)*0.15);line-height:1.15;min-height:calc(var(--ch)*0.3);flex:none;max-height:calc(var(--ch)*0.46);display:flex;flex-direction:column;justify-content:center;word-break:keep-all;overflow:hidden}
.card .band small{font-weight:400;font-size:calc(var(--cw)*0.12);opacity:.9}
.card .rule{flex:1 1 0;min-height:0;font-size:max(8px,calc(var(--cw)*0.115));line-height:1.2;padding:2px 3px;overflow:hidden;text-align:center;color:#2a2a30}
.card .rank{text-align:center;font-size:max(8px,calc(var(--cw)*0.11));color:#7a5010;min-height:1.2em;line-height:1.2}
.card .foot{height:calc(var(--cw)*0.2);flex:none}
.card .st{position:absolute;bottom:-5px;width:calc(var(--cw)*0.34);height:calc(var(--cw)*0.34);border-radius:50%;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--cw)*0.19);color:#fff}
.card .st.a{left:-5px;background:#e6aa1e}.card .st.h{right:-5px;background:#c83232}
.card .st .up{color:#bfffbf}.card .st .dn{color:#ffc4d0}
.card .cost{position:absolute;top:-6px;left:-6px;width:calc(var(--cw)*0.34);height:calc(var(--cw)*0.34);border-radius:50%;background:#2870d2;border:1.5px solid #fff;color:#fff;font-weight:800;font-size:calc(var(--cw)*0.2);display:flex;align-items:center;justify-content:center}
.card .cost.up{color:#ffc4d0}.card .cost.dn{color:#bfffbf}
.card .elb{position:absolute;top:-6px;right:-6px;width:calc(var(--cw)*0.3);height:calc(var(--cw)*0.3);font-size:calc(var(--cw)*0.16)}
.card .elb.sub{top:calc(var(--cw)*0.25);right:-4px;width:calc(var(--cw)*0.21);height:calc(var(--cw)*0.21);font-size:calc(var(--cw)*0.12)}
.card .elb.season{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.card .ov{position:absolute;inset:0;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--cw)*0.16)}
.card .ov.frz{background:rgba(150,210,255,.45);color:#0a2a60}.card .ov.stl{background:rgba(20,20,30,.45);color:#fff}
.card .note{position:absolute;left:10%;right:10%;top:44%;text-align:center;font-size:max(9px,calc(var(--cw)*0.11));color:#fff;background:rgba(40,40,50,.72);border-radius:4px;padding:1px 0}
.card.taunt{border:4px solid #5c5c68}
.card.shield{box-shadow:0 0 0 3px rgba(255,215,90,.85)}
.card.ready{border-color:#3ddc5a;box-shadow:0 0 0 2px #3ddc5a}
.card.tgt{border-color:#ff6a3d;box-shadow:0 0 0 3px rgba(255,106,61,.8)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold);transform:translateY(-4px)}
.card.shield.ready{box-shadow:0 0 0 2px #3ddc5a,0 0 0 5px rgba(255,215,90,.85)}
.card .badge{position:absolute;left:8%;right:8%;top:-18px;background:#c82820;color:#fff;font-size:11px;font-weight:700;text-align:center;border-radius:5px;padding:1px 0}
.gap{width:14px;height:calc(var(--ch) - 16px);border-radius:6px;background:rgba(255,215,90,.55);display:flex;align-items:center;justify-content:center;font-size:10px;color:#3a2a00;flex:none;cursor:pointer;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
/* ---------- 손패 */
#handWrap{padding:6px 4px 4px;background:#20242c;border-top:1px solid #353b47}
#hand{display:flex;gap:6px;overflow-x:auto;padding:10px 8px 8px;scrollbar-width:thin}
#hand .card{--cw:var(--hw);--ch:var(--hh)}
#hand .card.play{border-color:#3ddc5a;box-shadow:0 0 0 2px #3ddc5a}
#hand .card.dim{filter:saturate(.5) brightness(.8)}
#hand .card.sel{transform:translateY(-10px)}
#actbar{display:flex;gap:6px;align-items:center;padding:4px 8px;flex-wrap:wrap;min-height:40px}
#actbar .hint{flex:1;font-size:12.5px;color:var(--muted);min-width:120px}
#actbar .sk{font-size:12px;padding:5px 7px;max-width:100%}
#endTurn{background:#e0b850;color:#2a1e00;border-color:#e0b850;font-weight:700;padding:8px 14px}
#logLine{font-size:12px;color:var(--muted);padding:2px 10px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
/* ---------- 옆 칸 (넓은 화면) */
#side{display:none;width:320px;flex:none;flex-direction:column;gap:8px;padding:8px;background:#22262e;border-left:1px solid #353b47;min-height:0}
#sideInfo{background:#f8f5ee;color:#222;border-radius:8px;padding:10px;font-size:13px;line-height:1.5;flex:0 0 46%;overflow:auto}
#sideInfo h2{font-size:17px;margin:0 0 2px}#sideInfo h3{font-size:13.5px;margin:8px 0 2px}#sideInfo .muted{color:#666;font-size:12px}#sideInfo .lore{color:#6a5a48;font-size:12px;white-space:pre-wrap;margin-top:8px;border-top:1px solid #ddd5c4;padding-top:6px}#sideInfo .lock{color:#999}
#sideLog{flex:1;overflow:auto;font-size:12px;color:#c8cfda;background:#1b1f26;border-radius:8px;padding:6px 8px;min-height:80px}
#sideLog div{padding:1px 0}
@media (min-width:980px) and (min-height:560px){
  :root{--cw:min(calc((100vw - 380px)/7 - 8px),104px);--hw:104px}
  #side{display:flex}#logLine{display:none}
}
@media (orientation:landscape) and (max-height:560px){
  :root{--hw:62px}
  #app{display:grid;grid-template-columns:minmax(0,1fr) min(300px,38vw);grid-template-rows:auto minmax(0,1fr)}
  #topbar{grid-column:1/3}
  #main{grid-column:1;grid-row:2;min-height:0}
  #handWrap{grid-column:2;grid-row:2;border-top:none;border-left:1px solid #353b47;overflow:auto;display:flex;flex-direction:column}
  #hand{flex-wrap:wrap;overflow:visible;justify-content:center;gap:10px 8px}
  #actbar{order:2}#logLine{order:3}
  .hero{padding:2px 10px;min-width:min(300px,94%)}.hero .hp{font-size:17px}.hero .mana{display:none}
  .row{padding:2px 0}.mid{height:18px}
}
/* ---------- 창 */
.sheetBack{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#f8f5ee;color:#1e1e24;width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px 18px;font-size:14px;line-height:1.55}
@media (min-width:700px){.sheetBack{align-items:center}.sheet{border-radius:14px}}
.sheet h2{margin:0 0 4px;font-size:19px}.sheet h3{margin:12px 0 4px;font-size:15px}
.sheet .muted{color:#666;font-size:12.5px}
.sheet button{background:#e9e4d8;color:#222;border-color:#c9c2b2}
.sheet button.primary{background:#d9a93c;border-color:#c0902a;color:#241a05}
.sheet select,.sheet input[type=text]{background:#fff;color:#222;border-color:#c9c2b2}
.sheet .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.sheet .btns button{flex:1}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.choice button{padding:14px 10px;text-align:left;line-height:1.45;min-height:110px}
.choice b{display:block;font-size:16px;margin-bottom:4px}
.lock{color:#999}
.lore{color:#6a5a48;font-size:12.5px;white-space:pre-wrap;margin-top:8px;border-top:1px solid #ddd5c4;padding-top:6px}
.list{display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto;border:1px solid #ddd5c4;border-radius:8px;background:#fff}
.list .it{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #eee6d6;cursor:pointer;font-size:13px}
.list .it:active{background:#f2ead8}
.list .it .c{width:22px;height:22px;border-radius:50%;background:#2870d2;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.list .it .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .m{color:#777;font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gain{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #eee6d6;font-size:13px}
.gain .up{color:#b46a00;font-weight:700}
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#home h1{font-size:22px;margin:0;color:var(--gold)}#home p{color:var(--muted);margin:0;font-size:13px}
#home button{width:min(320px,90%);padding:14px;font-size:16px}
.float{position:fixed;pointer-events:none;font-weight:800;font-size:20px;color:#ff5a5a;text-shadow:0 1px 2px #000;z-index:40;animation:up 1s forwards}
.float.heal{color:#7fff8a}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-36px);opacity:0}}
.toast{position:fixed;left:50%;top:44px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;opacity:.92;max-width:90%}
</style>
</head>

const DeckSize = 20, MaxCopies = 2;
const Themes = [['그리스', ['GRE']], ['북유럽', ['NOR']], ['이집트', ['EGY']], ['메소포타미아·페르시아', ['MES', 'PER']],
  ['인도', ['IND']], ['중국', ['CHN']], ['일본·한국', ['JPN', 'KOR']], ['한국', ['KOR']], ['아메리카', ['AZT', 'MAY', 'INC']],
  ['게티아 악마', ['GOE']], ['타로', ['TAR']], ['십이지·오행', ['GAN', 'EAS']]];

// 시드 난수 (두 기기에서 같은 결과를 내기 위해)
function makeRng(seed) {

function buildThemed(cards, title, codes, seed) {
  const rnd = makeRng(seed), byId = new Map(cards.map(c => [c.id, c]));
  const d = { title: title + ' 덱', ids: [], preset: true };
  const theme = cards.filter(c => codes.includes(c.mythCode)).sort((a, b) => a.cost - b.cost || a.id - b.id);
  const many = theme.length >= 14;
  for (const tc of theme) { d.ids.push(tc.id); if (!many && tc.cost <= 6) d.ids.push(tc.id); }
  while (d.ids.length > DeckSize) {

    d.ids.splice(hi, 1);
  }
  const others = cards.filter(c => !codes.includes(c.mythCode) && c.cost <= 5).map(c => [rnd.next(), c]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  let i = 0;
  while (d.ids.length < DeckSize && others.length > 0 && i <= 500) {
    const oc = others[i % others.length];
    if (d.ids.filter(x => x === oc.id).length < MaxCopies) d.ids.push(oc.id);
    i++;
  }
  d.ids.sort((a, b) => byId.get(a).cost - byId.get(b).cost);

}

const NoTarget = Object.freeze({ side: -1, uid: -1 });

const GraceCard = new CardDef();

class Game {

    this.MaxBoard = 7; this.MaxHand = 10;

      deck: (s ? deck1 : deck0).slice(), hand: [], board: [], lastEl: '' }));

    for (let i = 0; i < 4; i++) this.draw(this.players[1 - firstSide]);
    this.players[1 - firstSide].hand.push(GraceCard);
    this.say(this.players[firstSide].title + ' 먼저 시작합니다.');
    this.beginTurn();
  }

      return;

    const c = p.deck.shift();

    return Math.max(0, a);
  }
  elementBonus(att, def) {
    if (!att || !def || att.def.isNeutral || def.def.isNeutral) return 0;
    return overcomes(att.def.mainEl, def.def.defenseEl) ? 1 : 0;
  }
  fight(x, y) {
    const dx = this.attackOf(x) + this.elementBonus(x, y), dy = this.attackOf(y) + this.elementBonus(y, x);
    this.say('  ' + x.def.title + ' ↔ ' + y.def.title + ' 싸움');
    this.damageMinion(y, dx); this.damageMinion(x, dy);
  }

  // ---------------- 조회
  findMinion(uid) { for (const p of this.players) for (const m of p.board) if (m.uid === uid) return m; return null; }
  skillOf(m, slot) { return slot === 1 ? m.def.active1 : slot === 2 ? m.def.active2 : slot === 3 ? m.def.special : null; }
  skillUnlocked(m, slot) { return slot === 1 ? true : slot === 2 ? m.tier >= Active2Tier : slot === 3 ? m.tier >= SpecialTier : false; }
  validTargets(side, spec, source) {
    const list = [], mine = this.players[side], other = this.players[1 - side];
    const enemyMins = () => { for (const m of other.board) if (!m.stealth) list.push(T(other.side, m.uid)); };
    const myMins = () => { for (const m of mine.board) list.push(T(mine.side, m.uid)); };
    switch (spec) {
      case 'ANY': list.push(T(other.side, 0)); enemyMins(); list.push(T(mine.side, 0)); myMins(); break;
      case 'ENEMY': list.push(T(other.side, 0)); enemyMins(); break;
      case 'FRIEND': list.push(T(mine.side, 0)); myMins(); break;
      case 'ANY_MIN': enemyMins(); myMins(); break;
      case 'ENEMY_MIN': enemyMins(); break;
      case 'FRIEND_MIN': myMins(); break;
    }
    return list;
  }
  canPlay(side, hi) {
    if (this.winner >= 0 || side !== this.current) return false;
    const p = this.players[side];
    if (hi < 0 || hi >= p.hand.length) return false;
    const c = p.hand[hi];
    if (this.costOf(side, c) > p.mana) return false;
    if (c.isSpell) {
      const spec = chosenSpec(c.spellEffects);
      return !(spec && this.validTargets(side, spec, null).length === 0);
    }
    return p.board.length < this.boardLimit(side);
  }
  playSpec(c) {
    if (c.isSpell) return chosenSpec(c.spellEffects);
    for (const cl of c.clausesOf('PLAY')) { const s = chosenSpec(cl.effects); if (s) return s; }
    return '';
  }
  canAttack(m) {
    if (!m || this.winner >= 0 || m.side !== this.current) return false;
    if (m.acted || m.frozen || this.attackOf(m) <= 0) return false;
    if (m.def.isArbiter && !(m.flags.has('LONE') && this.players[m.side].board.length === 1)) return false;
    if (m.summonedThisTurn && !m.charge) return false;
    return true;
  }
  attackTargets(m) {
    const other = this.players[1 - m.side];
    const taunts = other.board.filter(x => x.taunt && !x.stealth);
    if (taunts.length) return taunts.map(t => T(other.side, t.uid));
    const list = [T(other.side, 0)];
    for (const om of other.board) if (!om.stealth) list.push(T(other.side, om.uid));
    return list;
  }
  canUseSkill(m, slot) {
    if (!m || this.winner >= 0 || m.side !== this.current) return false;
    const sk = this.skillOf(m, slot);
    if (!sk || !this.skillUnlocked(m, slot)) return false;
    if (m.acted || m.frozen) return false;
    if (slot === 3 && m.specialUsed) return false;
    if (sk.cost > this.players[m.side].mana) return false;
    const spec = chosenSpec(sk.effects);
    if (spec && this.validTargets(m.side, spec, m).length === 0) return false;
    return true;
  }

  // ---------------- 행동
  // act = {kind:'play'|'attack'|'skill'|'end', hand, uid, slot, target, pos, choice}
  apply(side, act) {
    if (this.winner >= 0 || side !== this.current) return false;
    const has = (list, t) => !isNone(t) && list.some(x => sameRef(x, t));
    switch (act.kind) {
      case 'end': this.endTurnInternal(); return true;
      case 'play': {
        if (!this.canPlay(side, act.hand)) return false;
        const p = this.players[side], c = p.hand[act.hand], spec = this.playSpec(c);
        let tgt = act.target || NoTarget;
        if (spec) {
          const valid = this.validTargets(side, spec, null);
          if (c.isSpell) { if (!has(valid, tgt)) return false; }
          else if (valid.length > 0 && !has(valid, tgt)) return false;
          else if (valid.length === 0) tgt = NoTarget;
        }
        const pay = this.costOf(side, c);
        p.hand.splice(act.hand, 1);
        p.mana -= pay;
        this.sourceCard = c;
        if (c.id > 0) this.playedIds[side].add(c.id);
        const opt = c.choices.length === 2 ? c.choices[act.choice === 2 ? 1 : 0] : null;
        const costNote = pay !== c.cost ? ' (비용 ' + pay + ')' : '';
        if (c.isSpell) {
          this.say(p.title + ": 주문 '" + c.title + "'" + costNote);
          this.execute(side, null, c.spellEffects, tgt);
          if (opt) { this.say('  선택: ' + opt.title); this.execute(side, null, opt.effects, NoTarget); }
        } else {
          const m = this.summon(side, c, false, act.pos == null ? -1 : act.pos);
          this.say(p.title + ": '" + c.title + "' 출전" + costNote);
          if (m) {
            for (const cl of c.clausesOf('PLAY')) this.execute(side, m, cl.effects, tgt);
            if (opt) { this.say('  선택: ' + opt.title); this.execute(side, m, opt.effects, NoTarget); }
          }
        }
        if (c.mainEl && !c.isNeutral) p.lastEl = c.mainEl;
        this.cleanup();
        return true;
      }
      case 'attack': {
        const m = this.findMinion(act.uid);
        if (!m || m.side !== side || !this.canAttack(m)) return false;
        if (!has(this.attackTargets(m), act.target)) return false;
        m.acted = true; m.stealth = false; this.sourceCard = m.def;
        const foe = this.players[1 - side];
        if (isHero(act.target)) {
          const d = this.attackOf(m);
          this.say(m.def.title + ' → ' + foe.title + ' 공격 (' + d + ')');
          this.damageHero(foe, d);
        } else {
          const t = this.findMinion(act.target.uid);
          this.say(m.def.title + ' → ' + t.def.title + ' 공격');
          const a1 = this.attackOf(m) + this.elementBonus(m, t), a2 = this.attackOf(t) + this.elementBonus(t, m);
          if (this.elementBonus(m, t) > 0) this.say('  상극 +1 (' + m.def.mainEl + '→' + t.def.defenseEl + ')');
          this.damageMinion(t, a1); this.damageMinion(m, a2);
        }
        this.cleanup();
        return true;
      }
      case 'skill': {
        const m = this.findMinion(act.uid);
        if (!m || m.side !== side || !this.canUseSkill(m, act.slot)) return false;
        const sk = this.skillOf(m, act.slot), spec = chosenSpec(sk.effects);
        if (spec && !has(this.validTargets(side, spec, m), act.target)) return false;
        this.players[side].mana -= sk.cost;
        m.acted = true; this.sourceCard = m.def;
        if (act.slot === 3) m.specialUsed = true;
        this.say(m.def.title + ': ' + (act.slot === 3 ? '특수능력 ' : '') + "'" + sk.title + "'");
        this.execute(side, m, sk.effects, act.target || NoTarget);
        this.cleanup();
        return true;
      }
    }
    return false;
  }

  // ---------------- 효과
  summon(side, c, isTokenSummon, pos) {
    const p = this.players[side];
    if (p.board.length >= this.boardLimit(side)) return null;
    const ts = c.isToken ? [1, 1] : this.tierOf(side, c);
    const m = { uid: this.nextUid++, def: c, side, atk: c.atk, hp: c.hp, maxHp: c.hp, taunt: false, charge: false, shield: false,
      stealth: false, frozen: false, thawPending: 0, summonedThisTurn: true, acted: false, specialUsed: false,
      tier: ts[0], star: ts[1], flags: new Set() };
    if (!c.isToken) { const b = statBonus(m.tier, m.star); m.atk += b[0]; m.hp += b[1]; m.maxHp += b[1]; }
    m.taunt = c.hasKeyword('TAUNT'); m.charge = c.hasKeyword('CHARGE'); m.shield = c.hasKeyword('SHIELD'); m.stealth = c.hasKeyword('STEALTH');
    if (pos >= 0 && pos <= p.board.length) p.board.splice(pos, 0, m); else p.board.push(m);
    if (isTokenSummon) this.say('  ' + c.title + ' 소환');
    return m;
  }
  execute(side, source, effects, chosen) {
    for (const ef of effects) {
      if (this.winner >= 0) return;
      switch (ef.op) {
        case 'DRAW': for (let i = 0; i < ef.n; i++) this.draw(this.players[side]); break;
        case 'MANA': this.players[side].mana = Math.min(10, this.players[side].mana + ef.n); break;
        case 'ARMOR': this.players[side].armor += ef.n; break;
        case 'FLAG': if (source) source.flags.add(ef.keyword); break;
        case 'DISCARD': {
          const foe = this.players[1 - side];
          for (let i = 0; i < ef.n && foe.hand.length; i++) {
            const k = this.rnd.int(foe.hand.length);
            this.say('  ' + foe.title + "의 '" + foe.hand[k].title + "' 버려짐");
            foe.hand.splice(k, 1);
          }
          break;
        }
        case 'FIGHT_ENEMIES': case 'INFIGHT': {
          const pool = this.players[ef.op === 'FIGHT_ENEMIES' ? 1 - side : side].board.filter(x => x.hp > 0 && x !== source);
          if (pool.length >= 2) {
            const i1 = this.rnd.int(pool.length); let i2 = this.rnd.int(pool.length - 1); if (i2 >= i1) i2++;
            this.fight(pool[i1], pool[i2]);
          }
          break;
        }
        case 'FACE_OFF': {
          if (!source) break;
          const mine = this.players[side].board, theirs = this.players[1 - side].board, idx = mine.indexOf(source);
          for (const j of [idx - 1, idx + 1]) {
            if (j >= 0 && j < mine.length && j < theirs.length && mine[j].hp > 0 && theirs[j].hp > 0) this.fight(mine[j], theirs[j]);
          }
          break;
        }
        case 'SUMMON': {
          const tk = new CardDef();
          tk.id = -1; tk.mythCode = source ? source.def.mythCode : ''; tk.title = ef.tokenName; tk.atk = ef.n; tk.hp = ef.n2; tk.isToken = true;
          if (ef.tokenKw) tk.passive = { title: '', cost: 0, effects: [], choices: [], clauses: [{ trigger: 'KW', keyword: ef.tokenKw, effects: [] }] };
          this.summon(side, tk, true, -1);
          break;
        }
        default:
          for (const t of this.resolve(side, source, ef.target, chosen)) this.applyOne(ef, t);
      }
    }
  }
  resolve(side, source, spec, chosen) {
    const list = [], mine = this.players[side], other = this.players[1 - side];
    switch (spec) {
      case 'SELF': if (source) list.push(T(side, source.uid)); break;
      case 'MY_HERO': list.push(T(side, 0)); break;
      case 'ENEMY_HERO': list.push(T(other.side, 0)); break;
      case 'ALL': case 'ALL_MIN': case 'ALL_ENEMY': case 'ALL_ENEMY_MIN': case 'ALL_FRIEND': case 'ALL_FRIEND_MIN': case 'OTHER_FRIEND_MIN': {
        const enemyOk = spec === 'ALL' || spec === 'ALL_MIN' || spec.startsWith('ALL_ENEMY');
        const friendOk = spec === 'ALL' || spec === 'ALL_MIN' || spec.startsWith('ALL_FRIEND') || spec === 'OTHER_FRIEND_MIN';
        const heroes = !spec.endsWith('_MIN');
        if (enemyOk) { if (heroes) list.push(T(other.side, 0)); for (const m of other.board) list.push(T(other.side, m.uid)); }
        if (friendOk) {
          if (heroes) list.push(T(side, 0));
          for (const m of mine.board) { if (spec === 'OTHER_FRIEND_MIN' && source && m === source) continue; list.push(T(side, m.uid)); }
        }
        break;
      }
      case 'RANDOM_ENEMY': case 'RANDOM_ENEMY_MIN': {
        const pool = [];
        if (spec === 'RANDOM_ENEMY') pool.push(T(other.side, 0));
        for (const m of other.board) if (m.hp > 0) pool.push(T(other.side, m.uid));
        if (pool.length) list.push(pool[this.rnd.int(pool.length)]);
        break;
      }
      default: if (!isNone(chosen)) list.push(chosen);
    }
    return list;
  }
  applyOne(ef, t) {
    const m = isHero(t) ? null : this.findMinion(t.uid);
    if (!isHero(t) && !m) return;
    switch (ef.op) {
      case 'DMG': if (isHero(t)) this.damageHero(this.players[t.side], ef.n); else this.damageMinion(m, ef.n); break;
      case 'HEAL': if (isHero(t)) this.players[t.side].hp = Math.min(30, this.players[t.side].hp + ef.n); else m.hp = Math.min(m.maxHp, m.hp + ef.n); break;
      case 'BUFF': if (m) { m.atk += ef.n; m.maxHp += ef.n2; m.hp += ef.n2; } break;
      case 'KW': if (m) { if (ef.keyword === 'TAUNT') m.taunt = true; else if (ef.keyword === 'CHARGE') m.charge = true;
        else if (ef.keyword === 'SHIELD') m.shield = true; else if (ef.keyword === 'STEALTH') m.stealth = true; } break;
      case 'FREEZE': if (m) { m.frozen = true; m.thawPending = m.side === this.current ? 2 : 1; this.say('  ' + m.def.title + ' 빙결'); } break;
      case 'DESTROY': if (m) { m.hp = 0; this.say('  ' + m.def.title + ' 처치'); } break;
    }
  }
  damageHero(p, n) {
    if (n <= 0) return;
    const ab = Math.min(p.armor, n); p.armor -= ab; p.hp -= n - ab;
    if (p.hp <= 0) {
      if (this.finisherId === 0 && this.sourceCard && !this.sourceCard.isToken) this.finisherId = this.sourceCard.id;
      this.checkWin();
    }
  }
  damageMinion(m, n) {
    if (n <= 0 || !m) return;
    if (m.shield) { m.shield = false; this.say('  ' + m.def.title + '의 신의 가호가 벗겨졌습니다'); return; }
    m.hp -= n;
  }
  cleanup() {
    for (let guard = 1; guard <= 50; guard++) {
      const dead = [];
      for (const sd of [this.current, 1 - this.current]) for (const m of this.players[sd].board) if (m.hp <= 0) dead.push(m);
      if (!dead.length) break;
      for (const m of dead) { const b = this.players[m.side].board; b.splice(b.indexOf(m), 1); this.say('  ' + m.def.title + ' 쓰러짐'); }
      for (const m of dead) for (const cl of m.def.clausesOf('DEATH')) { this.sourceCard = m.def; this.execute(m.side, m, cl.effects, NoTarget); }
    }
    this.checkWin();
  }
  checkWin() {
    if (this.winner >= 0) return;
    const d0 = this.players[0].hp <= 0, d1 = this.players[1].hp <= 0;
    if (d0 && d1) { this.winner = 2; this.say('무승부!'); }
    else if (d0) { this.winner = 1; this.say(this.players[1].title + ' 승리!'); }
    else if (d1) { this.winner = 0; this.say(this.players[0].title + ' 승리!'); }
  }
}

// ============================================================ AI
class AiPlayer {
  constructor(side) { this.side = side; }
  nextAction(g) {
    if (g.winner >= 0 || g.current !== this.side) return { kind: 'end' };
    return this.tryPlay(g) || this.trySkill(g) || this.tryAttack(g) || { kind: 'end' };
  }
  pickChoice(g, c) {
    if (c.choices.length !== 2) return 1;
    return this.choiceScore(g, c.choices[1]) > this.choiceScore(g, c.choices[0]) ? 2 : 1;
  }
  choiceScore(g, opt) {
    const me = g.players[this.side], foe = g.players[1 - this.side];
    let s = 0;
    for (const ef of opt.effects) {
      switch (ef.op) {
        case 'FIGHT_ENEMIES': s += foe.board.length >= 2 ? 4 + Math.min(foe.board.length, 4) : 0; break;
        case 'DISCARD': s += Math.min(ef.n, foe.hand.length) * 3; break;
        case 'FACE_OFF': { const mid = Math.floor(me.board.length / 2); s += (foe.board.length > mid + 1 || (mid > 0 && foe.board.length >= mid)) ? 4 : 0; break; }
        case 'INFIGHT': s -= me.board.length >= 2 ? 4 : 0; break;
        case 'FLAG':
          if (ef.keyword === 'LONE') s += me.board.length === 0 ? 4 : 1;
          else if (ef.keyword === 'BALANCE2') s += me.board.length >= 2 ? 3 : 1;
          else if (ef.keyword === 'WITHER') s -= me.board.length;
          else if (ef.keyword === 'NARROW') s -= me.board.length >= 5 ? 3 : 1;
          break;
        case 'DRAW': s += 2 * ef.n; break;
        default: s += 1;
      }
    }
    return s;
  }
  tryPlay(g) {
    const p = g.players[this.side];
    const order = p.hand.map((_, i) => i).sort((a, b) => g.costOf(this.side, p.hand[b]) - g.costOf(this.side, p.hand[a]));
    for (const hi of order) {
      if (!g.canPlay(this.side, hi)) continue;
      const c = p.hand[hi];
      if (c === GraceCard) {
        if (!p.hand.some(x => x !== GraceCard && g.costOf(this.side, x) === p.mana + 1)) continue;
        return { kind: 'play', hand: hi, target: NoTarget, pos: -1, choice: 1 };
      }
      const effects = c.isSpell ? c.spellEffects : c.clausesOf('PLAY').flatMap(cl => cl.effects);
      const spec = g.playSpec(c);
      let tgt = NoTarget;
      if (spec) {
        const cand = g.validTargets(this.side, spec, null);
        if (cand.length) {
          tgt = this.bestTarget(g, effects, cand, null);
          if (isNone(tgt) && c.isSpell) continue;
          if (isNone(tgt)) tgt = cand[0];
        }
      } else if (c.isSpell && c.spellEffects.length && !this.worthAuto(g, c.spellEffects)) continue;
      const pos = c.isArbiter ? Math.floor(p.board.length / 2) : -1;
      return { kind: 'play', hand: hi, target: tgt, pos, choice: this.pickChoice(g, c) };
    }
    return null;
  }
  worthAuto(g, effects) {
    const me = g.players[this.side], foe = g.players[1 - this.side];
    const val = b => b.reduce((s, m) => s + m.atk + m.hp, 0);
    for (const ef of effects) {
      switch (ef.op) {
        case 'DMG': case 'DESTROY':
          if (ef.target.includes('ENEMY')) return foe.board.length > 0 || ef.target === 'ALL_ENEMY';
          if (ef.target === 'ALL_MIN' || ef.target === 'ALL') return val(foe.board) > val(me.board) + 2;
          break;
        case 'HEAL': return me.hp <= 22 || me.board.some(m => m.hp < m.maxHp);
        case 'BUFF': case 'KW': return me.board.length > 0;
        case 'FREEZE': return foe.board.length > 0;
        case 'MANA': return me.hand.some(x => g.costOf(this.side, x) > me.mana && g.costOf(this.side, x) <= me.mana + ef.n - 1 && !x.spellEffects.some(e => e.op === 'MANA'));
      }
    }
    return true;
  }
  bestTarget(g, effects, cand, source) {
    const spec = chosenSpec(effects), ef = effects.find(x => x.target === spec);
    let best = NoTarget, bestScore = -Infinity;
    for (const t of cand) {
      const mine = t.side === this.side, m = isHero(t) ? null : g.findMinion(t.uid);
      let score = -Infinity;
      switch (ef.op) {
        case 'DMG':
          if (mine) continue;
          if (isHero(t)) score = g.players[t.side].hp <= ef.n ? 1000 : 3;
          else if (m.shield) score = 2;
          else if (m.hp <= ef.n) score = 10 + m.atk * 2 + m.def.cost;
          else score = m.atk;
          break;
        case 'DESTROY': if (mine || isHero(t)) continue; score = m.atk * 2 + m.hp + m.def.cost; break;
        case 'FREEZE': if (mine) continue; score = isHero(t) ? 0 : m.atk * 2; break;
        case 'HEAL': {
          if (!mine) continue;
          const lost = isHero(t) ? 30 - g.players[t.side].hp : m.maxHp - m.hp;
          if (lost <= 0) continue;
          score = Math.min(lost, ef.n) + (isHero(t) ? 0 : 1); break;
        }
        case 'BUFF': case 'KW':
          if (!mine || isHero(t)) continue;
          if (source && m === source) continue;
          score = m.atk + m.hp; break;
      }
      if (score > bestScore) { bestScore = score; best = t; }
    }
    return best;
  }
  trySkill(g) {
    const p = g.players[this.side];
    for (const m of p.board.slice()) {
      for (const slot of [3, 2, 1]) {
        if (!g.canUseSkill(m, slot)) continue;
        const sk = g.skillOf(m, slot), spec = chosenSpec(sk.effects);
        let tgt = NoTarget;
        if (spec) { tgt = this.bestTarget(g, sk.effects, g.validTargets(this.side, spec, m), m); if (isNone(tgt)) continue; }
        else if (!this.worthAuto(g, sk.effects)) continue;
        if (slot !== 3 && g.canAttack(m) && !this.skillBeatsAttack(g, m, sk)) continue;
        return { kind: 'skill', uid: m.uid, slot, target: tgt };
      }
    }
    return null;
  }
  skillBeatsAttack(g, m, sk) {
    let gain = 0;
    for (const ef of sk.effects) {
      switch (ef.op) {
        case 'DMG': gain += ef.n * (ef.target.startsWith('ALL') ? 2 : 1); break;
        case 'DESTROY': gain += 6; break;
        case 'SUMMON': gain += ef.n + ef.n2; break;
        case 'BUFF': gain += (ef.n + ef.n2) * (ef.target.startsWith('ALL') ? 2 : 1); break;
        case 'DRAW': gain += 2 * ef.n; break;
        case 'HEAL': gain += Math.floor(ef.n / 2); break;
        default: gain += 1;
      }
    }
    return gain > g.attackOf(m);
  }
  tryAttack(g) {
    const p = g.players[this.side], foe = g.players[1 - this.side];
    const attackers = p.board.filter(x => g.canAttack(x)).sort((a, b) => g.attackOf(b) - g.attackOf(a));
    if (!attackers.length) return null;
    const total = attackers.reduce((s, x) => s + g.attackOf(x), 0);
    for (const m of attackers) {
      const targets = g.attackTargets(m), faceOk = targets.some(isHero);
      if (faceOk && total >= foe.hp + foe.armor) return { kind: 'attack', uid: m.uid, target: T(foe.side, 0) };
      let best = NoTarget, bestScore = -Infinity;
      for (const t of targets) {
        if (isHero(t)) continue;
        const e = g.findMinion(t.uid);
        const kills = !e.shield && g.attackOf(m) + g.elementBonus(m, e) >= e.hp;
        const dies = !m.shield && g.attackOf(e) + g.elementBonus(e, m) >= m.hp;
        let score;
        if (kills && !dies) score = 100 + e.atk + e.def.cost;
        else if (kills) score = e.def.cost >= m.def.cost ? 50 + e.def.cost - m.def.cost : -10;
        else if (!dies && e.shield) score = 20;
        else score = -50;
        if (e.taunt) score += 30;
        if (score > bestScore) { bestScore = score; best = t; }
      }
      if (!faceOk) { if (!isNone(best)) return { kind: 'attack', uid: m.uid, target: best }; continue; }
      if (!isNone(best) && bestScore >= 50) return { kind: 'attack', uid: m.uid, target: best };
      return { kind: 'attack', uid: m.uid, target: T(foe.side, 0) };
    }
    return null;
  }
}

<script>// Voltaic Myth Card Battle (신화 카드 대전) with Claude — 화면 (웹판)
(function () {

// ------------------------------------------------------------ 저장 (브라우저 안)
// PC판(VoltaicMythCards.exe) 안에서 돌 때: 카드·경험치·덱을 exe 가 넘겨주고, 바뀌면 exe 에 알려 파일에 저장한다.

const store = {
  get(k, d) { try { const v = localStorage.getItem('vmc.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vmc.' + k, JSON.stringify(v)); } catch (e) { /* 저장 못 해도 게임은 된다 */ } }
};

// ------------------------------------------------------------ 상태
const S = {
  cards: [], byId: new Map(), lore: {}, presets: [], xp: {}, decks: [],
  game: null, ai: null, mySide: 0, practice: false, aiLevelMode: 0, aiLevel: 0,
  placing: null, pending: null, selUid: 0, aiTimer: 0, resultShown: false, hoverKey: '',
  last: store.get('last', { my: 'p:0', ai: 'rand', first: 'rand', mode: 0, practice: false })
};
function saveXp() { if (HOST) tellHost('xp', S.xp); else store.set('xp', S.xp); }
function saveDecks() { if (HOST) tellHost('decks', S.decks); else store.set('decks', S.decks); }
const levelOfCard = c => MC.levelFromXp(S.xp[c.id] || 0);
const deckList = () => S.presets.map((d, i) => ({ key: 'p:' + i, d })).concat(S.decks.map((d, i) => ({ key: 'u:' + i, d })));
const deckOf = key => { const [t, i] = key.split(':'); return t === 'p' ? S.presets[+i] : S.decks[+i]; };

  S.cards.forEach(c => S.byId.set(c.id, c));

// ============================================================ 홈

}

// ============================================================ 창(시트)
function sheet(html, onClick, opts = {}) {
  const back = document.createElement('div');

  back.innerHTML = `<div class="sheet">${html}<\/div>`;
  document.body.appendChild(back);

    if (e.target === back) { if (!opts.modal) { close(); opts.onCancel && opts.onCancel(); } return; }
    const b = e.target.closest('[data-a]');

}
function ask(msg, yesText, onYes) {
  sheet(`<h2>${esc(msg)}<\/h2><div class="btns"><button data-a="no">취소<\/button><button class="primary" data-a="yes">${esc(yesText)}<\/button><\/div>`,

}
function toast(s) {

}

// ------------------------------------------------------------ 새 대전
function newGameSheet() {
  const opts = deckList().map(x => `<option value="${x.key}">${x.key[0] === 'p' ? '[추천] ' : ''}${esc(x.d.title)}<\/option>`).join('');
  const L = S.last;
  const s = sheet(`<h2>새 대전<\/h2>
    <h3>내 덱<\/h3><select id="ngMy">${opts}<\/select>
    <h3>AI 덱<\/h3><select id="ngAi"><option value="rand">무작위 추천 덱<\/option>${opts}<\/select>
    <div class="grid2"><div><h3>선공<\/h3><select id="ngFirst"><option value="rand">무작위<\/option><option value="0">나<\/option><option value="1">AI<\/option><\/select><\/div>
    <div><h3>AI 등급<\/h3><select id="ngMode"><option value="0">내 덱 평균<\/option><option value="1">정령<\/option><option value="2">태초신<\/option><\/select><\/div><\/div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="ngPrac"> 연습 (양쪽 모두 태초신, 경험치 없음)<\/label>
    <div class="btns"><button data-a="cancel">취소<\/button><button class="primary" data-a="go">시작<\/button><\/div>`,
    (a, b, close) => {
      if (a === 'cancel') return close();
      const my = $('#ngMy').value, ai = $('#ngAi').value, first = $('#ngFirst').value, mode = +$('#ngMode').value, prac = $('#ngPrac').checked;
      S.last = { my, ai, first, mode, practice: prac }; store.set('last', S.last);
      close(); startGame(my, ai, first, mode, prac);
    });
  const setSel = (id, v) => { const el = s.el.querySelector(id); if ([...el.options].some(o => o.value === v)) el.value = v; };
  setSel('#ngMy', L.my); setSel('#ngAi', L.ai); setSel('#ngFirst', String(L.first)); setSel('#ngMode', String(L.mode));
  s.el.querySelector('#ngPrac').checked = !!L.practice;
}

function startGame(myKey, aiKey, first, mode, practice) {
  const myDeck = deckOf(myKey) || S.presets[0];
  const aiDeck = aiKey === 'rand' ? S.presets[Math.floor(Math.random() * S.presets.length)] : (deckOf(aiKey) || S.presets[1]);
  const seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  const g = new MC.Game(cardsOf(myDeck), cardsOf(aiDeck), '나', 'AI · ' + aiDeck.title, seed);
  g.startTerm = MC.termOfDate(new Date());
  S.practice = practice; S.aiLevelMode = mode;
  const mine = cardsOf(myDeck).filter(c => !c.isSpell);
  S.aiLevel = mode === 2 ? MC.MaxLevel : mode === 1 ? 0 : (mine.length ? Math.floor(mine.reduce((s, c) => s + levelOfCard(c), 0) / mine.length) : 0);
  g.tierOf = (sd, c) => {
    const lv = practice ? MC.MaxLevel : sd === S.mySide ? levelOfCard(c) : S.aiLevel;
    return [MC.tierOfLevel(lv), MC.starOfLevel(lv)];
  };
  netClose();
  S.game = g; S.ai = new MC.AiPlayer(1); S.mySide = 0;
  S.placing = null; S.pending = null; S.selUid = 0; S.resultShown = false;
  buildBattle();
  g.start(first === 'rand' ? Math.floor(Math.random() * 2) : +first);
  render();
  if (g.current === 1) runAi();
}

// ============================================================ 대전 화면
function buildBattle() {
  $('#app').innerHTML = `
  <div id="topbar"><div class="term" id="term"><\/div><div class="track" id="track"><\/div><button id="chatBtn" class="hidden" aria-label="말하기">💬<\/button><button id="menuBtn" aria-label="메뉴">☰<\/button><\/div>
  <div id="main">
    <div id="board">
      <div class="hero foe" id="foeHero" data-k="hero:1"><\/div>
      <div class="row" id="foeRow"><\/div>
      <div class="mid"><span id="banner"><\/span><\/div>
      <div class="row" id="myRow"><\/div>
      <div class="hero me" id="myHero" data-k="hero:0"><\/div>
    <\/div>
    <div id="side"><div id="sideInfo">카드 위에 마우스를 올리면 설명이 나옵니다.<\/div><div id="sideLog"><\/div><\/div>
  <\/div>
  <div id="handWrap"><div id="actbar"><\/div><div id="hand"><\/div><div id="logLine"><\/div><\/div>`;
  $('#menuBtn').onclick = battleMenu;
  $('#chatBtn').onclick = chatSheet;
  $('#chatBtn').classList.toggle('hidden', !S.net);
  $('#logLine').onclick = logSheet;
}

function myTurn() { const g = S.game; return g && g.winner < 0 && g.current === S.mySide && !S.aiTimer && !(S.net && S.net.ended); }

function currentTargets() {
  const g = S.game; if (!g || !myTurn()) return [];
  if (S.pending) {
    if (S.pending.kind === 'play') return g.validTargets(S.mySide, g.playSpec(g.players[S.mySide].hand[S.pending.hand]), null);
    if (S.pending.kind === 'skill') { const m = g.findMinion(S.pending.uid); return g.validTargets(S.mySide, MC.chosenSpec(g.skillOf(m, S.pending.slot).effects), m); }
  }
  if (S.selUid) { const m = g.findMinion(S.selUid); if (m && g.canAttack(m)) return g.attackTargets(m); }
  return [];
}

function elBadge(el, cls) {
  return `<span class="elb ${cls || ''}" style="background:${MC.ElementColor[el] || '#777'}">${MC.ElementHanja[el] || ''}<\/span>`;
}
function attrBadges(c, m) {
  if (c.isToken) return '';
  if (c.isNeutral) return `<span class="elb" style="background:#787880">無<\/span>`;
  if (c.isArbiter) return `<span class="elb" style="background:linear-gradient(90deg,${MC.ElementColor[c.mainEl]} 50%,${MC.ElementColor[c.subEl]} 50%)">調<\/span>`;
  if (!c.mainEl) return '';
  const seasonal = m && S.game && S.game.seasonBonus(m) > 0;
  let h = elBadge(c.mainEl, seasonal ? 'season' : '');
  if (c.attrKind === '양' && c.subEl) h += elBadge(c.subEl, 'sub');
  return h;
}

function cardHtml(c, m, o = {}) {
  const g = S.game;
  const col = c.isToken ? '#6e737d' : MC.mythColor(c.mythCode);
  const cls = ['card'];
  const taunt = m ? m.taunt : c.hasKeyword('TAUNT'), shield = m ? m.shield : c.hasKeyword('SHIELD');
  if (taunt) cls.push('taunt'); if (shield) cls.push('shield');
  if (o.cls) cls.push(...o.cls);
  const kind = c.isSpell ? '주문' : c.isToken ? '소환물' : MC.mythName(c.mythCode);
  let h = `<div class="${cls.join(' ')}" data-k="${o.key}">`;
  h += `<div class="band" style="background:${col}">${esc(c.title)}<small>${esc(kind)}<\/small><\/div>`;
  h += `<div class="rule">${esc(MC.rulesLine(c))}<\/div>`;
  h += `<div class="rank">${o.rank && !c.isSpell && !c.isToken ? esc(o.rank) : ''}<\/div><div class="foot"><\/div>`;
  if (o.showCost) {
    const cc = o.cost == null ? c.cost : o.cost;
    h += `<div class="cost ${cc < c.cost ? 'dn' : cc > c.cost ? 'up' : ''}">${cc}<\/div>`;
  }
  h += attrBadges(c, m);
  if (!c.isSpell) {
    const bonus = o.bonus || [0, 0];
    const atk = m ? (g ? g.attackOf(m) : m.atk) : c.atk + bonus[0];
    const hp = m ? m.hp : c.hp + bonus[1];
    const aCls = m ? (atk < m.atk ? 'dn' : atk > c.atk ? 'up' : '') : bonus[0] > 0 ? 'up' : '';
    const hCls = m && m.hp < m.maxHp ? 'dn' : (!m && bonus[1] > 0) || (m && m.maxHp > c.hp) ? 'up' : '';
    h += `<div class="st a"><span class="${aCls}">${atk}<\/span><\/div><div class="st h"><span class="${hCls}">${hp}<\/span><\/div>`;
  }
  if (m) {
    if (m.stealth) h += `<div class="ov stl">그림자<\/div>`;
    if (m.frozen) h += `<div class="ov frz">빙결<\/div>`;
    if (m.side === S.mySide && m.summonedThisTurn && !m.charge && !m.acted && !c.isArbiter) h += `<div class="note">출전 대기<\/div>`;
    else if (m.side === S.mySide && m.acted) h += `<div class="note">행동 완료<\/div>`;
  }

  return h + '<\/div>';
}

function heroHtml(p, isMe, tgt) {
  const g = S.game, turn = g.current === p.side && g.winner < 0;
  let info = isMe
    ? `<span class="mana">${Array.from({ length: 10 }, (_, i) => `<i class="${i < p.mana ? 'on' : i < p.maxMana ? 'max' : ''}"><\/i>`).join('')}<\/span><span class="sub">${p.mana}/${p.maxMana} · 덱 ${p.deck.length}<\/span>`
    : `<span class="sub">손패 ${p.hand.length} · 덱 ${p.deck.length} · 신력 ${p.mana}/${p.maxMana}<\/span>`;
  return `<span class="nm">${esc(p.title)}${turn ? ' ▶' : ''}<\/span>${info}<span>${p.armor > 0 ? `<span class="sub">방어 ${p.armor} <\/span>` : ''}<span class="hp ${p.hp <= 10 ? 'low' : ''}">♥${p.hp}<\/span><\/span>`;
}

function render() {
  const g = S.game; if (!g) return;
  const me = g.players[S.mySide], foe = g.players[1 - S.mySide];
  const targets = currentTargets();
  const isT = (side, uid) => targets.some(t => t.side === side && t.uid === uid);
  // 맨 위 절기 띠
  const t = g.term, el = MC.seasonElement(t);
  $('#term').innerHTML = `<span class="nm">${MC.TermNames[t]} ${MC.TermHanja[t]}<\/span>${elBadge(el)}<span class="rest">${MC.seasonName(t)} · ${el} 강세 공격+1 · ${MC.oppositeOf(el) ? MC.oppositeOf(el) + ' 비용+1 · ' : ''}상생 연속 −1 · 소식괘 ${MC.monthGuaOf(t)}<\/span>`;
  $('#term').querySelector('.elb').style.cssText += ';width:18px;height:18px;font-size:11px';
  $('#track').innerHTML = Array.from({ length: 24 }, (_, i) => `<i style="background:${MC.ElementColor[MC.seasonElement(i)]};opacity:${i === t ? 1 : .35};${i === t ? 'outline:1.5px solid #fff' : ''}"><\/i>`).join('');
  // 영웅
  const fh = $('#foeHero'), mh = $('#myHero');
  fh.innerHTML = heroHtml(foe, false); mh.innerHTML = heroHtml(me, true);
  fh.dataset.k = 'hero:' + foe.side; mh.dataset.k = 'hero:' + me.side;
  fh.classList.toggle('turn', g.current === foe.side && g.winner < 0); mh.classList.toggle('turn', g.current === me.side && g.winner < 0);
  fh.classList.toggle('tgt', isT(foe.side, 0)); mh.classList.toggle('tgt', isT(me.side, 0));
  // 하수인 줄
  const atker = S.selUid ? g.findMinion(S.selUid) : null;
  const rowHtml = (p, mine) => {
    if (!p.board.length && !(mine && S.placing)) return `<span class="empty">${mine ? '내 전장' : '상대 전장'}<\/span>`;
    let h = '';
    p.board.forEach((m, i) => {
      if (mine && S.placing) h += `<div class="gap" data-k="gap:${i}">▼<\/div>`;
      const cls = [];
      if (mine && myTurn() && g.canAttack(m)) cls.push('ready');
      if (m.uid === S.selUid) cls.push('sel');
      if (isT(p.side, m.uid)) cls.push('tgt');
      const badge = !mine && atker && isT(p.side, m.uid) && g.elementBonus(atker, m) > 0 ? '상극 +1' : '';
      h += cardHtml(m.def, m, { key: 'min:' + m.uid, cls, rank: MC.rankText(m.tier, m.star), badge });
    });
    if (mine && S.placing) h += `<div class="gap" data-k="gap:${p.board.length}">▼<\/div>`;
    return h;
  };
  sizeCards(foe.board.length, me.board.length + (S.placing ? 1 : 0));
  $('#foeRow').innerHTML = rowHtml(foe, false);
  $('#myRow').innerHTML = rowHtml(me, true);
  $('#banner').textContent = bannerText();
  // 손패
  const pendHand = S.placing ? S.placing.hand : S.pending && S.pending.kind === 'play' ? S.pending.hand : -1;
  $('#hand').innerHTML = me.hand.map((c, i) => {
    const ok = myTurn() && g.canPlay(S.mySide, i);
    const lv = S.practice ? MC.MaxLevel : levelOfCard(c);
    const bonus = c.isSpell ? [0, 0] : MC.statBonus(MC.tierOfLevel(lv), MC.starOfLevel(lv));
    return cardHtml(c, null, { key: 'hand:' + i, showCost: true, cost: g.costOf(S.mySide, c), bonus,
      rank: c === MC.GraceCard ? '' : MC.rankTextOfLevel(lv), cls: [ok ? 'play' : 'dim', i === pendHand ? 'sel' : ''].filter(Boolean) });
  }).join('');
  renderActbar();
  // 기록
  const lastLines = g.log.slice(-1);
  $('#logLine').textContent = '기록 ▸ ' + (lastLines[0] || '');
  const sl = $('#sideLog');
  if (sl && getComputedStyle($('#side')).display !== 'none') {
    sl.innerHTML = g.log.slice(-200).map(x => `<div>${esc(x)}<\/div>`).join('');
    sl.scrollTop = sl.scrollHeight;
  }
  if (g.winner >= 0 && !S.resultShown) { S.resultShown = true; setTimeout(showResult, 700); }
}

// 전장 하수인 수와 화면 크기에 맞춰 카드 크기를 정한다
function sizeCards(nFoe, nMe) {
  const bd = $('#board'); if (!bd) return;
  const n = Math.max(4, nFoe, nMe);
  const wide = window.innerWidth >= 980 && window.innerHeight >= 560;
  const byW = (bd.clientWidth - 16) / n - 8 - (S.placing ? 20 : 0);
  const byH = ((bd.clientHeight - 130) / 2 - 12) / 1.32;
  const cw = Math.max(40, Math.floor(Math.min(wide ? 118 : 92, byW, byH)));
  bd.style.setProperty('--cw', cw + 'px');
  bd.style.setProperty('--ch', Math.round(cw * 1.32) + 'px');
}
window.addEventListener('resize', () => { if (S.game) render(); });

function bannerText() {
  const g = S.game;
  if (g.winner >= 0) return g.winner === S.mySide ? '승리했습니다!' : g.winner === 2 ? '무승부' : '패배했습니다';
  if (S.net && S.net.ended) return '상대와 연결이 끊겼습니다';
  if (S.net && g.current !== S.mySide) return '상대 차례 · ' + g.players[1 - S.mySide].title;
  if (S.aiTimer || g.current !== S.mySide) return '상대가 생각하는 중…';
  if (S.placing) return '놓을 자리(▼)를 누르세요';
  if (S.pending) return '대상을 누르세요';
  if (S.selUid) return '공격할 대상을 누르거나 스킬을 쓰세요';
  return '내 차례';
}

function renderActbar() {
  const g = S.game, bar = $('#actbar');
  let h = '';
  const m = S.selUid ? g.findMinion(S.selUid) : null;
  if (m && m.side === S.mySide && myTurn()) {
    for (const slot of [1, 2, 3]) {
      const sk = g.skillOf(m, slot); if (!sk) continue;
      const head = slot === 3 ? '특수' : '액티브' + slot;
      if (!g.skillUnlocked(m, slot)) { h += `<button class="sk" disabled>🔒 ${head} ${esc(sk.title)}<\/button>`; continue; }
      if (slot === 3 && m.specialUsed) { h += `<button class="sk" disabled>${head} ${esc(sk.title)} (사용함)<\/button>`; continue; }
      h += `<button class="sk" data-sk="${slot}" ${g.canUseSkill(m, slot) ? '' : 'disabled'}>${head} · ${esc(sk.title)} [${sk.cost}]<\/button>`;
    }
    h += `<button class="sk" data-info="min:${m.uid}">설명<\/button>`;
  } else if (S.placing || S.pending) {
    h += `<span class="hint">${S.placing ? '▼ 자리를 고르세요' : '빨갛게 표시된 대상을 누르세요'}<\/span><button data-cancel="1">취소<\/button>`;
  } else {
    h += `<span class="hint">${myTurn() ? '카드를 누르면 냅니다 · 길게 누르면 설명' : ''}<\/span>`;
  }
  if (!(S.placing || S.pending)) h += `<button id="endTurn" ${myTurn() ? '' : 'disabled'}>턴 종료<\/button>`;
  bar.innerHTML = h;
  bar.onclick = e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.id === 'endTurn') return endMyTurn();
    if (b.dataset.cancel) return cancelSel();
    if (b.dataset.info) return detailSheet(b.dataset.info);
    if (b.dataset.sk) return useSkill(+b.dataset.sk);
  };
}

// ============================================================ 누르기 처리 (탭 / 길게 누르기)
function wirePointer() {
  let timer = 0, startKey = '', sx = 0, sy = 0, longDone = false;
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('.sheetBack')) return;
    const el = e.target.closest('[data-k]'); startKey = el ? el.dataset.k : '';
    sx = e.clientX; sy = e.clientY; longDone = false;
    clearTimeout(timer);
    if (startKey && S.game && !startKey.startsWith('gap')) {
      timer = setTimeout(() => { longDone = true; detailSheet(startKey); }, 480);
    }
  });
  document.addEventListener('pointermove', e => {
    if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 12) clearTimeout(timer);
  });
  document.addEventListener('pointerup', e => {
    clearTimeout(timer);
    if (longDone || !S.game || e.target.closest('.sheetBack') || e.target.closest('button')) return;
    if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 12) return;
    if (!e.target.closest('#board') && !e.target.closest('#hand')) return;
    if (e.button === 2) return;
    const el = e.target.closest('[data-k]');
    onTap(el ? el.dataset.k : '');
  });
  document.addEventListener('contextmenu', e => {
    if (!S.game || e.target.closest('.sheetBack')) return;
    e.preventDefault();
    const el = e.target.closest('[data-k]');
    if (el && !el.dataset.k.startsWith('gap')) detailSheet(el.dataset.k); else cancelSel();
  });
  document.addEventListener('mouseover', e => {
    if (!S.game) return;
    const el = e.target.closest('[data-k]'); const k = el ? el.dataset.k : '';
    if (k && k !== S.hoverKey) { S.hoverKey = k; sideInfo(k); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cancelSel(); });
}

function keyCard(k) {
  const g = S.game; if (!g || !k) return null;
  const [t, v] = k.split(':');
  if (t === 'hand') { const c = g.players[S.mySide].hand[+v]; return c ? { c, m: null } : null; }
  if (t === 'min') { const m = g.findMinion(+v); return m ? { c: m.def, m } : null; }
  return null;
}

function onTap(k) {
  const g = S.game;
  if (!k) { cancelSel(); return; }
  if (!myTurn()) return;
  const [t, v] = k.split(':'); const n = +v;
  if (t === 'gap') {
    if (!S.placing) return;
    const act = S.placing; S.placing = null; act.pos = n; continuePlay(act); return;
  }
  if (t === 'hand') {
    S.selUid = 0;
    const pend = S.placing ? S.placing.hand : S.pending && S.pending.kind === 'play' ? S.pending.hand : -1;
    if (pend === n) { cancelSel(); return; }
    S.placing = null; S.pending = null;
    const p = g.players[S.mySide], c = p.hand[n];
    if (!g.canPlay(S.mySide, n)) {
      toast(g.costOf(S.mySide, c) > p.mana ? '신력이 모자랍니다' : !c.isSpell ? '전장이 가득 찼습니다' : '고를 수 있는 대상이 없습니다');
      render(); return;
    }
    const act = { kind: 'play', hand: n, target: MC.NoTarget, pos: -1, choice: 1 };
    if (!c.isSpell && p.board.length > 0) { S.placing = act; render(); return; }
    continuePlay(act); return;
  }
  const ref = t === 'hero' ? MC.T(n, 0) : (() => { const m = g.findMinion(n); return m ? MC.T(m.side, m.uid) : null; })();
  if (!ref) return;
  if (S.placing) { toast('먼저 놓을 자리(▼)를 고르세요'); return; }
  if (S.pending) {
    if (currentTargets().some(x => MC.sameRef(x, ref))) {
      const act = S.pending; S.pending = null; S.selUid = 0; act.target = ref;
      if (act.kind === 'play') finishPlay(act); else doMine(act);
    } else toast('그 대상은 고를 수 없습니다');
    return;
  }
  if (S.selUid && ref.side !== S.mySide) {
    const m = g.findMinion(S.selUid);
    if (m && g.canAttack(m) && g.attackTargets(m).some(x => MC.sameRef(x, ref))) {
      S.selUid = 0; doMine({ kind: 'attack', uid: m.uid, target: ref }); return;
    }
    toast('그 대상은 공격할 수 없습니다 (수호 먼저)'); return;
  }
  if (ref.side === S.mySide && !MC.isHero(ref)) {
    S.selUid = S.selUid === ref.uid ? 0 : ref.uid;
    sideInfo('min:' + ref.uid);
    render();
  }
}

function continuePlay(act) {
  const g = S.game, c = g.players[S.mySide].hand[act.hand], spec = g.playSpec(c);
  if (spec && g.validTargets(S.mySide, spec, null).length > 0) { S.pending = act; render(); return; }
  finishPlay(act);
}
function finishPlay(act) {
  const c = S.game.players[S.mySide].hand[act.hand];
  if (c.choices.length === 2) {
    choiceSheet(c, ch => { if (!ch) { S.pending = null; S.placing = null; render(); return; } act.choice = ch; doMine(act); });
    return;
  }
  doMine(act);
}
function useSkill(slot) {
  const g = S.game, m = g.findMinion(S.selUid);
  if (!m || !g.canUseSkill(m, slot)) return;
  const sk = g.skillOf(m, slot);
  if (MC.chosenSpec(sk.effects)) { S.pending = { kind: 'skill', uid: m.uid, slot, target: MC.NoTarget }; render(); return; }
  S.selUid = 0; doMine({ kind: 'skill', uid: m.uid, slot, target: MC.NoTarget });
}
function cancelSel() {
  if (!S.game || (!S.placing && !S.pending && !S.selUid)) return;
  S.placing = null; S.pending = null; S.selUid = 0; render();
}

// ------------------------------------------------------------ 적용 + 숫자 띄우기
function snapshot() {
  const g = S.game, m = new Map();
  for (const p of g.players) { m.set('hero:' + p.side, p.hp + p.armor); for (const x of p.board) m.set('min:' + x.uid, x.hp); }
  return m;
}
function applyAndShow(side, act) {
  const before = snapshot();
  // 쓰러지는 하수인 위치를 알기 위해 그리기 전에 자리를 기억
  const pos = new Map();
  before.forEach((_, k) => { const el = document.querySelector(`[data-k="${k}"]`); if (el) pos.set(k, el.getBoundingClientRect()); });
  const ok = S.game.apply(side, act);
  render();
  const after = snapshot();
  before.forEach((v, k) => {
    const now = after.has(k) ? after.get(k) : 0, d = now - v;
    if (!d) return;
    const el = document.querySelector(`[data-k="${k}"]`);
    const r = el ? el.getBoundingClientRect() : pos.get(k); if (!r) return;
    const f = document.createElement('div'); f.className = 'float' + (d > 0 ? ' heal' : '');
    f.textContent = (d > 0 ? '+' : '') + d; f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top + r.height / 3) + 'px';
    document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
  });
  return ok;
}
function doMine(act) {
  if (applyAndShow(S.mySide, act)) netSend({ t: 'act', a: act });
  else toast('그 행동은 할 수 없습니다');
}
function endMyTurn() {
  if (!myTurn()) return;
  S.placing = null; S.pending = null; S.selUid = 0;
  applyAndShow(S.mySide, { kind: 'end' });
  netSend({ t: 'act', a: { kind: 'end' } });
  if (!S.net && S.game.winner < 0 && S.game.current === 1) runAi();
}

// ------------------------------------------------------------ AI 차례
function stopAi() { clearTimeout(S.aiTimer); S.aiTimer = 0; }
function runAi() {
  const step = () => {
    const g = S.game;
    if (!g || g.winner >= 0 || g.current !== 1) { S.aiTimer = 0; render(); return; }
    const act = S.ai.nextAction(g);
    let ok = applyAndShow(1, act);
    if (!ok) { applyAndShow(1, { kind: 'end' }); }
    if (!ok || act.kind === 'end' || g.winner >= 0) { S.aiTimer = 0; render(); return; }
    S.aiTimer = setTimeout(step, 750);
  };
  S.aiTimer = setTimeout(step, 600);
  render();
}

// ============================================================ 설명
function detailHtml(c, m) {
  const g = S.game;
  let h = `<h2 style="color:${MC.mythColor(c.mythCode)}">${esc(c.title)}<\/h2>`;
  const kind = c.isSpell ? '주문' : c.isToken ? '소환물' : '하수인';
  let cost = '';
  if (!c.isToken) {
    cost = ' · 신력 ' + c.cost;
    if (!m && g) { const now = g.costOf(S.mySide, c); if (now !== c.cost) cost += ` (지금 ${now})`; }
  }
  h += `<div class="muted">${c.isToken ? '' : esc(MC.mythName(c.mythCode)) + ' · '}${kind}${cost}`;
  if (!c.isSpell) {
    const atk = m ? (g ? g.attackOf(m) : m.atk) : c.atk, hp = m ? m.hp : c.hp;
    h += ` · 공격 ${atk} / 체력 ${hp}`;
  }
  h += '<\/div>';
  const attr = MC.describeAttr(c);
  if (attr && !c.isToken) h += `<div style="font-weight:600;color:${MC.ElementColor[c.mainEl] || '#666'}">${esc(attr)}<\/div>`;
  if (m && m.flags.size) h += `<div style="color:#2a6aa0">선택 효과: ${[...m.flags].map(f => MC.FlagNames[f]).join(', ')}<\/div>`;
  if (c.choices.length === 2) h += `<div style="color:#784a90">선택: ${esc(c.choices[0].title)} (${esc(MC.describe(c.choices[0].effects))}) / ${esc(c.choices[1].title)} (${esc(MC.describe(c.choices[1].effects))})<\/div>`;
  if (c.isSpell) { if (c.spellEffects.length) h += `<p>${esc(MC.describe(c.spellEffects))}<\/p>`; }
  else {
    if (c.passive && c.passive.clauses.length) h += `<h3>패시브 · ${esc(c.passive.title)}<\/h3><div>${esc(MC.describePassive(c.passive))}<\/div>`;
    const tier = m ? m.tier : MC.tierOfLevel(S.practice && g ? MC.MaxLevel : levelOfCard(c));
    const sk = (head, s, open, from) => s ? `<h3 class="${open ? '' : 'lock'}">${head} · ${esc(s.title)} [신력 ${s.cost}]${open ? '' : ' 🔒 ' + from + '부터'}<\/h3><div class="${open ? '' : 'lock'}">${esc(MC.describe(s.effects))}<\/div>` : '';
    h += sk('액티브1', c.active1, true, '') + sk('액티브2', c.active2, tier >= MC.Active2Tier, MC.TierNames[MC.Active2Tier]) + sk('특수능력', c.special, tier >= MC.SpecialTier, MC.TierNames[MC.SpecialTier]);
    if (m) {
      const st = []; if (m.taunt) st.push('수호'); if (m.charge) st.push('질주'); if (m.shield) st.push('신의 가호'); if (m.stealth) st.push('그림자'); if (m.frozen) st.push('빙결');
      if (st.length) h += `<div style="color:#2a6aa0;margin-top:6px">지금 상태: ${st.join(', ')}<\/div>`;
      h += `<div class="muted">등급 ${MC.rankText(m.tier, m.star)}<\/div>`;
    }
  }
  if (!c.isSpell && !c.isToken && (!m || m.side === S.mySide)) {
    const lv = levelOfCard(c);
    h += `<div class="muted" style="color:#9a6a10">내 카드 등급: ${MC.rankTextOfLevel(lv)} · 경험치 ${S.xp[c.id] || 0}${lv >= MC.MaxLevel ? '' : ' / ' + MC.xpAtLevel(lv + 1)}<\/div>`;
  }
  const lore = S.lore[c.mythCode + '|' + c.title];
  if (lore) h += `<div class="lore">${esc(lore)}<\/div>`;
  return h;
}
function detailSheet(k) {
  let x = keyCard(k);
  if (!x && k && k.startsWith('card:')) { const c = S.byId.get(+k.split(':')[1]); if (c) x = { c, m: null }; }
  if (!x) return;
  sheet(detailHtml(x.c, x.m) + `<div class="btns"><button data-a="close">닫기<\/button><\/div>`, (a, b, close) => close());
}
function sideInfo(k) {
  const box = $('#sideInfo'); if (!box) return;
  const x = keyCard(k); if (!x) return;
  box.innerHTML = detailHtml(x.c, x.m);
}
function choiceSheet(c, done) {
  let answered = false;
  const s = sheet(`<h2>調 ${esc(c.title)}<\/h2><div class="muted">${esc(c.mainEl)}↔${esc(c.subEl)} — 상쇄된 힘을 어느 쪽으로 풀까요?<\/div>
    <div class="choice">${c.choices.map((o, i) => `<button data-a="c${i + 1}"><b>${esc(o.title)}<\/b>${esc(MC.describe(o.effects))}<\/button>`).join('')}<\/div>
    <div class="btns"><button data-a="cancel">취소<\/button><\/div>`,
    (a, b, close) => { answered = true; close(); done(a === 'cancel' ? 0 : +a.substring(1)); },
    { onCancel: () => { if (!answered) done(0); } });
  return s;
}
function logSheet() {
  const g = S.game; if (!g) return;
  sheet(`<h2>기록<\/h2><div style="font-size:12.5px;max-height:60vh;overflow:auto" id="logBox">${g.log.slice(-300).map(x => `<div>${esc(x)}<\/div>`).join('')}<\/div><div class="btns"><button data-a="close">닫기<\/button><\/div>`,
    (a, b, close) => close());
  const lb = document.getElementById('logBox'); lb.scrollTop = lb.scrollHeight;
}
function battleMenu() {
  sheet(`<h2>메뉴<\/h2><div class="btns" style="flex-direction:column">
    <button data-a="new">${S.net ? '대전 나가고 새 대전' : '새 대전'}<\/button><button data-a="log">기록 보기<\/button><button data-a="rules">규칙<\/button><button data-a="home">처음 화면으로<\/button><button data-a="close">닫기<\/button><\/div>`,
    (a, b, close) => {
      close();
      if (a === 'new') { stopAi(); if (S.net && S.game && S.game.winner < 0 && !S.net.ended) ask('대전을 나갈까요? (경험치 없음)', '나가기', () => { netClose(); newGameSheet(); }); else { netClose(); newGameSheet(); } }
      else if (a === 'log') logSheet();
      else if (a === 'rules') rulesSheet();
      else if (a === 'home') { if (S.game && S.game.winner < 0) ask('대전을 그만둘까요? (경험치 없음)', '그만두기', showHome); else showHome(); }
    });
}

// ============================================================ 결과
function showResult() {
  const g = S.game; stopAi();
  const msg = g.winner === S.mySide ? '승리했습니다!' : g.winner === 2 ? '무승부입니다.' : '패배했습니다.';
  const gains = [];
  const netNoXp = S.net && (S.net.fair >= 0 || S.net.ended);
  if (!S.practice && !netNoXp) {
    for (const id of g.playedIds[S.mySide]) {
      const c = S.byId.get(id); if (!c) continue;
      let amt = MC.XpPlayed; const parts = ['출전 ' + MC.XpPlayed];
      if (g.winner === S.mySide) { amt += MC.XpWin; parts.push('승리 ' + MC.XpWin); }
      if (g.winner === S.mySide && g.finisherId === id) { amt += MC.XpFinisher; parts.push('마무리 ' + MC.XpFinisher); }
      const lv0 = MC.levelFromXp(S.xp[id] || 0);
      S.xp[id] = (S.xp[id] || 0) + amt;
      const lv1 = MC.levelFromXp(S.xp[id]);
      gains.push({ c, amt, parts, lv0, lv1 });
    }
    saveXp();
  }
  gains.sort((a, b) => (b.lv1 - b.lv0) - (a.lv1 - a.lv0) || b.amt - a.amt);
  const note = S.practice ? '연습 대전이라 경험치는 쌓이지 않았습니다.' : netNoXp ? (S.net.ended ? '연결이 끊겨 경험치 없이 끝났습니다.' : '공정 모드라 경험치는 쌓이지 않았습니다.') : `낸 카드 +${MC.XpPlayed}${g.winner === S.mySide ? ', 승리 +' + MC.XpWin : ''}, 마무리 일격 +${MC.XpFinisher}`;
  sheet(`<h2>${msg}<\/h2><div class="muted">${note}<\/div><div style="margin-top:8px">${gains.map(x =>
    `<div class="gain"><span>${esc(x.c.title)} <span class="muted">+${x.amt} (${x.parts.join(', ')})<\/span><\/span>${x.c.isSpell ? '' : `<span class="${x.lv1 > x.lv0 ? 'up' : ''}">${x.lv1 > x.lv0 ? MC.rankTextOfLevel(x.lv0) + ' → ' : ''}${MC.rankTextOfLevel(x.lv1)}<\/span>`}<\/div>`).join('')}<\/div>
    <div class="btns"><button data-a="board">판 보기<\/button><button class="primary" data-a="again">${S.net ? '대인전 다시' : '새 대전'}<\/button><\/div>`,
    (a, b, close) => { close(); if (a === 'again') { if (S.net) { netClose(); netLobby(); } else newGameSheet(); } });
}

// ============================================================ 덱 편집
function deckEditor() {
  let cur = S.decks.length ? 0 : -1;
  let work = cur >= 0 ? S.decks[0].ids.slice() : [];
  let title = cur >= 0 ? S.decks[0].title : '새 덱';
  let filter = '';
  const s = sheet('<div id="de"><\/div>', null, { modal: true });
  const root = s.el.querySelector('#de');
  const draw = () => {
    const opts = S.decks.map((d, i) => `<option value="${i}" ${i === cur ? 'selected' : ''}>${esc(d.title)}<\/option>`).join('');
    const codes = [...new Set(S.cards.map(c => c.mythCode))];
    const pool = S.cards.filter(c => !filter || c.mythCode === filter).sort((a, b) => a.cost - b.cost || a.id - b.id);
    const groups = new Map(); work.forEach(id => groups.set(id, (groups.get(id) || 0) + 1));
    root.innerHTML = `<h2>덱 편집<\/h2>
      <div class="grid2"><select id="deSel"><option value="-1">+ 새 덱<\/option>${opts}<\/select><input type="text" id="deName" value="${esc(title)}"><\/div>
      <h3>덱 ${work.length}/${MC.DeckSize} <span class="muted">(누르면 뺌 · 같은 카드 ${MC.MaxCopies}장까지)<\/span><\/h3>
      <div class="list" style="max-height:24vh">${[...groups.entries()].sort((a, b) => S.byId.get(a[0]).cost - S.byId.get(b[0]).cost).map(([id, n]) => {
        const c = S.byId.get(id); return `<div class="it" data-a="rm:${id}"><span class="c">${c.cost}<\/span><span class="t">${esc(c.title)}<\/span><span class="m">×${n}<\/span><\/div>`; }).join('') || '<div class="it muted">아래 목록에서 카드를 누르세요<\/div>'}<\/div>
      <h3>카드 <select id="deFilter" style="width:auto;padding:4px"><option value="">전체<\/option>${codes.map(cd => `<option value="${cd}" ${cd === filter ? 'selected' : ''}>${esc(MC.mythName(cd))}<\/option>`).join('')}<\/select><\/h3>
      <div class="list" style="max-height:30vh">${pool.map(c => `<div class="it" data-a="add:${c.id}"><span class="c">${c.cost}<\/span><span class="t">${esc(c.title)}<\/span><span class="m">${c.isSpell ? '주문' : c.atk + '/' + c.hp} · ${esc(MC.mythName(c.mythCode))}<\/span><span class="m" data-a="info:${c.id}">ⓘ<\/span><\/div>`).join('')}<\/div>
      <div class="btns"><button data-a="del">삭제<\/button><button data-a="close">닫기<\/button><button class="primary" data-a="save">저장<\/button><\/div>`;
    root.querySelector('#deSel').onchange = e => { cur = +e.target.value; work = cur >= 0 ? S.decks[cur].ids.slice() : []; title = cur >= 0 ? S.decks[cur].title : '새 덱'; draw(); };
    root.querySelector('#deName').oninput = e => { title = e.target.value; };
    root.querySelector('#deFilter').onchange = e => { filter = e.target.value; draw(); };
  };
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const [a, v] = b.dataset.a.split(':');
    if (a === 'info') { e.stopPropagation(); detailSheet('card:' + v); return; }
    if (a === 'rm') { const i = work.indexOf(+v); if (i >= 0) work.splice(i, 1); draw(); }
    else if (a === 'add') {
      if (work.length >= MC.DeckSize) return toast('덱이 가득 찼습니다 (20장)');
      if (work.filter(x => x === +v).length >= MC.MaxCopies) return toast('같은 카드는 2장까지');
      work.push(+v); draw();
    } else if (a === 'save') {
      if (work.length !== MC.DeckSize) return toast('덱은 정확히 20장이어야 합니다');
      const d = { title: (title || '내 덱').trim(), ids: work.slice() };
      if (cur >= 0) S.decks[cur] = d; else { S.decks.push(d); cur = S.decks.length - 1; }
      saveDecks(); toast('저장했습니다'); draw();
    } else if (a === 'del') {
      if (cur < 0) return;
      ask('이 덱을 지울까요?', '삭제', () => { S.decks.splice(cur, 1); saveDecks(); cur = -1; work = []; title = '새 덱'; draw(); });
    } else if (a === 'close') s.close();
  });
  draw();
}
